name: Build AleVista

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (eine einzelne .exe, ohne .NET-Installation lauffähig)
        run: >
          dotnet publish src/AleVista.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AleVista-win-x64
          path: out/AleVista.exe

      - name: Release erstellen (Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AleVista.exe
          generate_release_notes: true

      - name: Release erstellen (jeder Push nach main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AleVista 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/AleVista.exe
          make_latest: true
          body: |
            AleVista.exe herunterladen und starten – keine Installation nötig.
            Stand: ${{ github.event.head_commit.message }}
